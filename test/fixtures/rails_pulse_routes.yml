api_users:
  http_methods: '["GET"]'
  path: "/api/users"
  controller_action: "api/users#index"
  tags: '["api", "users"]'
  created_at: <%= 2.days.ago %>
  updated_at: <%= 2.days.ago %>

api_posts:
  http_methods: '["POST"]'
  path: "/api/posts"
  controller_action: "api/posts#create"
  tags: '["api", "posts"]'
  created_at: <%= 2.days.ago %>
  updated_at: <%= 2.days.ago %>

api_test:
  http_methods: '["GET"]'
  path: "/api/test"
  controller_action: "api/test#index"
  tags: '["api"]'
  created_at: <%= 1.day.ago %>
  updated_at: <%= 1.day.ago %>

api_other:
  http_methods: '["POST"]'
  path: "/api/other"
  controller_action: "api/other#create"
  tags: '[]'
  created_at: <%= 1.day.ago %>
  updated_at: <%= 1.day.ago %>

api_cleanup:
  http_methods: '["DELETE"]'
  path: "/api/cleanup"
  controller_action: "api/cleanup#destroy"
  tags: '["maintenance"]'
  created_at: <%= 6.hours.ago %>
  updated_at: <%= 6.hours.ago %>
